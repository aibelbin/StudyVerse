<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#3d2f3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudyVerse" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>StudyVerse</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
</head>
<body>
  <!-- Loading screen: plain HTML/CSS/SVG so it shows before any script arrives. main.ts moves the bar and fades it out. -->
  <style>
    #loader { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
      background: radial-gradient(ellipse at 50% 35%, #fff4e4 0%, #fde3c8 45%, #f6c9a8 100%); font: 700 15px ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; color: #4a4058;
      transition: opacity 0.6s ease; overflow: hidden; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .logo { width: min(500px, 80vw); height: auto; max-height: 34vh; animation: ld-float 3s ease-in-out infinite; }
    #loader .chase { width: min(620px, 92vw); height: auto; max-height: 26vh; }
    #loader .tip { min-height: 1.4em; opacity: 0.85; text-align: center; padding: 0 16px; transition: opacity 0.3s; }
    #loader .bar { width: min(320px, 70vw); height: 12px; border-radius: 8px; background: #ffffffaa; box-shadow: inset 0 2px 4px #4a405822; overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 8%; border-radius: 8px; background: linear-gradient(90deg, #ffd36e, #ff9e7a); transition: width 0.5s ease; }
    #loader .slow { font-size: 13px; font-weight: 600; opacity: 0.7; }
    @keyframes ld-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
    /* the chase: both run left to right forever */
    .chase .runners { animation: ld-run 4.2s linear infinite; }
    @keyframes ld-run { from { transform: translateX(-260px); } to { transform: translateX(760px); } }
    .chase .bob { animation: ld-bob 0.28s ease-in-out infinite alternate; }
    .chase .bob2 { animation: ld-bob 0.24s ease-in-out infinite alternate; }
    @keyframes ld-bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    .chase .leg, .chase .leg2 { transform-box: fill-box; transform-origin: 50% 0; animation: ld-leg 0.28s ease-in-out infinite alternate; }
    .chase .leg2 { animation-direction: alternate-reverse; }
    @keyframes ld-leg { from { transform: rotate(32deg); } to { transform: rotate(-32deg); } }
    .chase .ear { transform-box: fill-box; transform-origin: 20% 10%; animation: ld-ear 0.14s ease-in-out infinite alternate; }
    @keyframes ld-ear { from { transform: rotate(-10deg); } to { transform: rotate(45deg); } }
    .chase .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: ld-ear 0.12s ease-in-out infinite alternate; }
    .chase .wing { transform-box: fill-box; transform-origin: 20% 30%; animation: ld-wing 0.12s ease-in-out infinite alternate; }
    @keyframes ld-wing { from { transform: rotate(10deg); } to { transform: rotate(-55deg); } }
    .chase .drop { animation: ld-drop 0.6s ease-in infinite; }
    @keyframes ld-drop { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-14px, 16px); opacity: 0; } }
    .chase .puff { transform-box: fill-box; transform-origin: center; animation: ld-puff 0.56s ease-out infinite; }
    .chase .puff.b { animation-delay: 0.28s; }
    @keyframes ld-puff { 0% { transform: translate(0, 0) scale(0.4); opacity: 0.8; } 100% { transform: translate(-30px, -8px) scale(1.4); opacity: 0; } }
    .chase .feather { animation: ld-feather 1.4s ease-out infinite; }
    @keyframes ld-feather { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-60px, -40px) rotate(220deg); opacity: 0; } }
    .chase .shout { animation: ld-shout 0.9s steps(1) infinite; }
    @keyframes ld-shout { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.25; } }
    @media (max-height: 460px) { #loader { gap: 1vh; } #loader .logo { max-height: 30vh; } #loader .chase { max-height: 30vh; } }
  </style>
  <div id="loader" role="status" aria-label="Loading StudyVerse">
    <svg class="logo" viewBox="20 0 500 170" aria-hidden="true">
      <!-- the mascot peeking over an open book -->
      <g transform="translate(70 18)">
        <path d="M-4 40 q 0 -38 50 -38 q 50 0 50 38 z" fill="#ef7d7d"/>
        <rect x="-6" y="34" width="104" height="14" rx="7" fill="#fffaf2"/>
        <circle cx="46" cy="-2" r="9" fill="#fffaf2"/>
        <ellipse cx="46" cy="74" rx="50" ry="44" fill="#9cc9f0"/>
        <circle cx="30" cy="66" r="6" fill="#3a2f44"/><circle cx="62" cy="66" r="6" fill="#3a2f44"/>
        <circle cx="32" cy="64" r="2" fill="#fff"/><circle cx="64" cy="64" r="2" fill="#fff"/>
        <ellipse cx="20" cy="80" rx="8" ry="5" fill="#ff9fb0"/><ellipse cx="72" cy="80" rx="8" ry="5" fill="#ff9fb0"/>
        <path d="M38 80 q 8 7 16 0" stroke="#3a2f44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- book -->
        <path d="M-22 92 q 34 -14 68 4 q 34 -18 68 -4 v 52 q -34 -14 -68 4 q -34 -18 -68 -4 z" fill="#fffaf2" stroke="#b07f5a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M46 96 v 52" stroke="#b07f5a" stroke-width="4"/>
        <path d="M-10 108 q 22 -8 46 2 M-10 120 q 22 -8 46 2 M56 110 q 22 -10 46 -2 M56 122 q 22 -10 46 -2" stroke="#e3c9a8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="-4" cy="94" r="7" fill="#9cc9f0"/><circle cx="96" cy="94" r="7" fill="#9cc9f0"/>
      </g>
      <!-- wordmark -->
      <text x="352" y="98" text-anchor="middle" font-family="ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif" font-weight="900" font-size="52" fill="#fffaf2" stroke="#4a4058" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Study<tspan fill="#ffd36e">Verse</tspan></text>
      <text x="352" y="130" text-anchor="middle" font-family="ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif" font-weight="700" font-size="16" fill="#8a6a7a">a cosy little town for studying together</text>
      <text x="478" y="48" font-size="22">✨</text>
    </svg>
    <svg class="chase" viewBox="0 0 600 170" aria-hidden="true">
      <path d="M-20 150 q 160 -26 320 -6 q 160 20 320 -4 v 40 h -640 z" fill="#9fd38a"/>
      <path d="M-20 150 q 160 -26 320 -6 q 160 20 320 -4" stroke="#7fbf6c" stroke-width="4" fill="none"/>
      <g fill="#7fbf6c"><path d="M60 140 l4 -12 l4 12z M70 141 l3 -9 l3 9z"/><path d="M420 145 l4 -12 l4 12z M430 146 l3 -9 l3 9z"/><path d="M250 142 l4 -11 l4 11z"/></g>
      <g class="runners">
        <!-- the dog, running for its life -->
        <g transform="translate(150 0)">
          <ellipse class="puff" cx="10" cy="140" rx="10" ry="6" fill="#ecdcc0"/>
          <ellipse class="puff b" cx="18" cy="142" rx="8" ry="5" fill="#ecdcc0"/>
          <g class="bob">
            <path class="tail" d="M14 98 q -18 -10 -16 -28" stroke="#c98a5a" stroke-width="7" fill="none" stroke-linecap="round"/>
            <g class="leg"><rect x="24" y="112" width="9" height="26" rx="4" fill="#b8774a"/></g>
            <g class="leg2"><rect x="70" y="112" width="9" height="26" rx="4" fill="#b8774a"/></g>
            <ellipse cx="52" cy="104" rx="40" ry="20" fill="#d99a66"/>
            <ellipse cx="50" cy="110" rx="22" ry="9" fill="#f2d2a8"/>
            <g class="leg2"><rect x="32" y="114" width="9" height="26" rx="4" fill="#d99a66"/></g>
            <g class="leg"><rect x="78" y="114" width="9" height="26" rx="4" fill="#d99a66"/></g>
            <circle cx="98" cy="86" r="22" fill="#d99a66"/>
            <ellipse cx="116" cy="94" rx="12" ry="9" fill="#f2d2a8"/>
            <circle cx="126" cy="90" r="4.5" fill="#3a2f44"/>
            <path d="M112 102 q 4 12 -2 16 q -6 -2 -4 -14" fill="#ff7a8a"/>
            <circle cx="98" cy="80" r="7" fill="#fff"/><circle cx="101" cy="79" r="3.5" fill="#3a2f44"/>
            <path d="M90 70 l 14 -4" stroke="#3a2f44" stroke-width="2.5" stroke-linecap="round"/>
            <path class="ear" d="M84 70 q -18 -4 -20 18 q 10 4 18 -6 z" fill="#8a5a3c"/>
            <path class="drop" d="M78 66 q -4 6 0 9 q 4 -3 0 -9z" fill="#7ab8ff"/>
          </g>
        </g>
        <!-- the chicken, furious about something -->
        <g transform="translate(0 4)">
          <path class="feather" d="M30 92 q 8 -6 14 2 q -6 4 -14 -2z" fill="#fffaf2" stroke="#e0d6c8"/>
          <g class="bob2">
            <g class="leg"><path d="M40 118 v 18 l -6 4 M40 136 l 6 4" stroke="#ff9e3d" stroke-width="5" fill="none" stroke-linecap="round"/></g>
            <g class="leg2"><path d="M56 118 v 18 l -6 4 M56 136 l 6 4" stroke="#ff9e3d" stroke-width="5" fill="none" stroke-linecap="round"/></g>
            <path d="M8 96 q -6 -18 8 -22 q -2 10 6 14z" fill="#fffaf2" stroke="#e8dccb" stroke-width="2"/>
            <ellipse cx="48" cy="100" rx="32" ry="24" fill="#fffaf2" stroke="#e8dccb" stroke-width="2"/>
            <path class="wing" d="M34 92 q 22 -8 26 14 q -18 8 -26 -14z" fill="#f2ebe0" stroke="#e0d6c8" stroke-width="2"/>
            <circle cx="76" cy="74" r="17" fill="#fffaf2" stroke="#e8dccb" stroke-width="2"/>
            <circle cx="70" cy="56" r="6" fill="#e8453c"/><circle cx="78" cy="54" r="7" fill="#e8453c"/><circle cx="86" cy="58" r="5.5" fill="#e8453c"/>
            <path d="M90 72 l 14 4 l -14 5 z" fill="#ffc531"/>
            <path d="M84 84 q 4 8 -2 10 q -4 -4 2 -10z" fill="#e8453c"/>
            <circle cx="80" cy="70" r="4" fill="#3a2f44"/>
            <path d="M73 62 l 13 5" stroke="#3a2f44" stroke-width="3" stroke-linecap="round"/>
            <text class="shout" x="58" y="40" font-size="20" font-weight="900" fill="#e8453c" font-family="ui-rounded, system-ui, sans-serif">!!</text>
          </g>
        </g>
      </g>
    </svg>
    <div class="tip" id="loader-tip">Waking up the town…</div>
    <div class="bar"><i id="loader-bar"></i></div>
    <div class="slow" id="loader-slow" hidden>Still going… if this sticks, try refreshing 🔄</div>
  </div>
  <script>
    (function () {
      var tips = ['Teaching the koi to read…', 'The chicken has not been told why it is angry…', 'Watering everyone\'s tulips…', 'Polishing the mini-golf windmill…',
        'Brewing a suspiciously strong latte…', 'Tuning the stage drums (badly)…', 'Convincing the trucks to stay parked…', 'Stacking the cairn one more stone…',
        'Fluffing the clouds…', 'The dog would like everyone to know it is fine…', 'Finding the library\'s quiet button…', 'Giving the ducks their bread…'];
      var i = Math.floor(Math.random() * tips.length);
      var el = document.getElementById('loader-tip');
      el.textContent = tips[i];
      window.__loaderTips = setInterval(function () { i = (i + 1) % tips.length; el.style.opacity = '0'; setTimeout(function () { el.textContent = tips[i]; el.style.opacity = '1'; }, 300); }, 2600);
      window.__loaderSlow = setTimeout(function () { var s = document.getElementById('loader-slow'); if (s) s.hidden = false; }, 20000);
    })();
  </script>
  <canvas id="c"></canvas>
  <div id="fade"></div>
  <div id="hud" hidden>
    <div id="status" class="glass panel"></div>
    <div id="online" class="glass panel"></div>
    <div id="feed" class="panel"></div>
    <div id="chat" class="glass panel"></div>
    <div id="prompt" class="glass" hidden></div>
    <div id="card" class="glass" hidden></div>
    <div id="toasts"></div>
    <div id="conn" class="glass" hidden>🔌 Reconnecting…</div>
  </div>
  <div id="join" class="screen" hidden></div>
  <div id="gone" class="screen" hidden>
    <div class="glass join-card">
      <h1>👋 See you in the other tab</h1>
      <p>The town is open in another tab or device, so this one is paused.</p>
      <button class="primary" onclick="location.reload()">Use this tab instead</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
